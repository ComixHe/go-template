version: '2'

linters:
  default: none
  enable:
    # Correctness: the golangci-lint standard set.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Errors: wrapped, compared and returned correctly.
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil
    - wrapcheck

    # Context and resources.
    - bodyclose
    - noctx
    - contextcheck
    - fatcontext
    - containedctx

    # Silent bug patterns.
    - durationcheck
    - makezero
    - musttag
    - mirror
    - exhaustive
    - unconvert

    # Narrow but zero-noise correctness checks.
    - gocheckcompilerdirectives
    - iotamixing

    # Performance: avoid unnecessary allocations and slow formatting.
    - prealloc
    - perfsprint

    # Modern Go idioms
    - exptostd
    - modernize
    - usestdlibvars
    - usetesting

    # Security.
    - gosec
    - bidichk

    # API and readability.
    - revive
    - gocritic
    - gocognit
    - misspell
    - unparam
    - godoclint
    - recvcheck
    - inamedparam
    - gochecknoinits

    # Tests.
    - testpackage
    - thelper

    # Lint hygiene: no bare, unused or unexplained //nolint directives.
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gosec:
      excludes:
        # G104 ("Errors unhandled") duplicates errcheck, which is stricter and
        # more precise.
        - G104

    revive:
      # Listing rules replaces revive's default set, so keep the defaults
      # explicitly instead of silently disabling everything.
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    gocritic:
      # Bug-finding checks only. Style and performance suggestions overlap
      # staticcheck and produce noise.
      disable-all: true
      enabled-tags:
        - diagnostic

    gocognit:
      min-complexity: 15

    exhaustive:
      # A switch with a default branch is considered exhaustive.
      default-signifies-exhaustive: true

    godoclint:
      enable:
        # Require docs on exported symbols and on every package. This replaces
        # revive's exported/package-comments rules with a newer implementation.
        - require-doc
        - require-pkg-doc
      options:
        require-doc:
          ignore-exported: false
          ignore-unexported: true

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # Only skip files with the canonical "Code generated ... DO NOT EDIT." header.
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - godoclint
        text: 'symbol should have a godoc'

formatters:
  enable:
    - gofumpt
    - gci
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    golines:
      max-len: 120
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  relative-path-mode: gomod
  modules-download-mode: readonly
