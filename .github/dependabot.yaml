version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      go-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'go'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      actions-dependencies:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'github-actions'
