version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    # NOTE: `main` is a plain path, it is NOT templated. Update it (or add
    # another build entry) when you add a new application under cmd/.
    main: ./cmd/demo
    binary: '{{ .ProjectName }}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - riscv64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/metadata.AppName={{ .ProjectName }}
      - -X {{ .ModulePath }}/internal/metadata.Version=v{{ .Version }}
      - -X {{ .ModulePath }}/internal/metadata.Commit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/metadata.BuildDate={{ .CommitDate }}
    # Keep the output reproducible: use the commit time, not the build time.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats: ['tar.gz']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    wrap_in_directory: true
    files:
      - LICENSES/*
      - README.md
      - CHANGELOG.md
    builds_info:
      # Reproducible archive metadata.
      mtime: '{{ .CommitTimestamp }}'

source:
  enabled: true

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

# Keyless signing of the checksum file with Sigstore. Because every artifact
# (archives, source tarball, SBOMs) is listed in checksums.txt, signing that one
# file covers them all.
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^style:'
      - '^chore'
      - '^build\(deps\)'

release:
  # Owner and repository name are inferred from the git remote.
  # Review the draft before publishing it.
  draft: true
  prerelease: auto
