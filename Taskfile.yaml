version: '3'
vars:
  PROJECT_NAME:
    sh: basename {{.USER_WORKING_DIR}}
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  GIT_DESCRIBE:
    sh: git describe --tags --match v* --long --dirty 2>/dev/null || echo "v0.0.0-0-gunknown"
  BUILD_DATE:
    sh: date -u +'%Y-%m-%dT%H:%M:%SZ'
  SEMVER:
    sh: |
      printf '%s\n' "{{.GIT_DESCRIBE}}" | sed \
        -e 's/-\([[:digit:]]\+\)-g/+\1\./' \
        -e 's/-dirty$$/\.dirty/' \
        -e 's/+0\.[^\.]\+\.\?/+/' \
        -e 's/^v//' \
        -e 's/+$$//'
  MODULE_PATH:
    sh: go list -m 2>/dev/null || echo "github.com/user/{{.PROJECT_NAME}}"
  METADATA_PKG: '{{.MODULE_PATH}}/internal/metadata'
  GO_BUILD_FLAGS: -v -trimpath -buildmode=pie
  LDFLAGS: >-
    -s
    -w
    -X '{{.METADATA_PKG}}.Version=v{{.SEMVER}}'
    -X '{{.METADATA_PKG}}.Commit={{.GIT_COMMIT}}'
    -X '{{.METADATA_PKG}}.BuildDate={{.BUILD_DATE}}'
  GCFLAGS: '{{if .DEBUG}}-N -l{{end}}'
  PREFIX: '{{.PREFIX | default "/usr/local"}}'
  BINDIR: '{{.DESTDIR}}{{.PREFIX}}/bin'
tasks:
  default:
    desc: Run the standard development pipeline (tidy, lint, Build)
    cmds:
      - task: tidy
      - task: lint
      - task: build:all
  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy
      - go mod verify
  prepare:
    desc: Prepare the environment for development
    internal: true
    run: once
    cmds:
      - go mod download
  lint:
    desc: Run golangci-lint analysis
    cmds:
      - task: lint:license
      - golangci-lint run --fix
  lint:ci:
    desc: Run golangci-lint analysis without fixes (CI only)
    cmds:
      - task: lint:license
      - golangci-lint run --timeout=5m
  lint:license:
    desc: Verify REUSE license compliance
    cmds:
      - reuse lint
  generate:
    desc: Safe code generation (disables GOWORK to prevent mod file corruption)
    deps: [prepare]
    cmds:
      - env GOWORK=off go generate -v -x ./...
      - task: tidy
  build:all:
    desc: Build all applications found in the cmd/ directory
    vars:
      APPS:
        sh: find cmd -maxdepth 1 -mindepth 1 -type d -exec basename {} \;
      cmds:
        - for: { var: APPS }
          task: build
          vars: { CLI_ARGS: '{{.ITEM}}' }
  build:
    desc: 'Build a specific application (Usage: task build -- <appname>)'
    summary: |
      Builds the Go binary for a specific application in the cmd/ directory.
      If no appname is provided, it defaults to the PROJECT_NAME.
    deps: [generate]
    vars:
      APP_NAME: '{{.CLI_ARGS | default .PROJECT_NAME}}'
      TARGET_PATH: './cmd/{{.APP_NAME}}'
    preconditions:
      - sh: test -d {{.TARGET_PATH}}
        msg: 'Error: Directory {{.TARGET_PATH}} does not exist.'
    cmds:
      - echo ">>> Building {{.APP_NAME}}..."
      - >-
        go build {{.GO_BUILD_FLAGS}}
        -gcflags="{{.GCFLAGS}}"
        -ldflags "{{.LDFLAGS}} -X '{{.METADATA_PKG}}.AppName=$APP_NAME'"
        -o bin/{{.APP_NAME}} {{.TARGET_PATH}}
    sources:
      - 'cmd/{{.APP_NAME}}/**/*.go'
      - 'internal/**/*.go'
      - 'pkg/**/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - 'bin/{{.APP_NAME}}'
  test:
    desc: Run all tests with race detection and coverage
    cmds:
      - go test -v -shuffle=on -timeout=2m ./...
  test:race:
    desc: Run all tests with race detection
    cmds:
      - go test -v -race -shuffle=on -timeout=5m -coverprofile=coverage.txt -covermode=atomic ./...
  test:memory:
    desc: Run all tests with memory sanitizer
    vars:
      CC: clang
    env: { CGO_ENABLED: 1 }
    cmds:
      - echo "Running Address Sanitizer (ASan)..."
      - go test -v -asan ./...
      - echo "Running Memory Sanitizer (MSan)..."
      - go test -v -msan ./...
  test:all:
    desc: Run all tests
    cmds:
      - task: test
      - task: test:race
      - task: test:memory
  install:
    desc: Install all built binaries to the system
    cmds:
      - install -d "{{.BINDIR}}"
      - |
        find bin/ -maxdepth 1 -type f -exec install -m 755 {} "{{.BINDIR}}/" \;
  clean:
    desc: Cleanup build artifacts and test cache
    cmds:
      - rm -rf bin/
      - go clean -testcache
      - go clean -v
  distclean:
    desc: Cleanup all caches
    cmds:
      - task: clean
      - go clean -cache
      - go clean -modcache
      - go clean -fuzzcache
